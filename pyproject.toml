[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocklab"
version = "0.1.0"
description = "Lab backtesting model ML untuk data saham"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "yfinance>=0.2.40",
    "scikit-learn>=1.4",
    "ollama>=0.3",
]
onnx = [
    "onnxruntime>=1.17",
]
forecast = [
    "chronos-forecasting>=2.0",
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["stocklab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
