[build-system]
# PEP 639 (license sebagai ekspresi SPDX + license-files) butuh setuptools 77.
# pip mengambilnya sendiri saat build, jadi versi setuptools yang terpasang di
# mesin user tidak perlu sebaru ini.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stocklab"
version = "0.1.0"
description = "Lab backtesting model ML untuk data saham"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Greg Ezra" }]
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "yfinance>=0.2.40",
    "scikit-learn>=1.4",
    "ollama>=0.3",
]
onnx = [
    "onnxruntime>=1.17",
]
forecast = [
    "chronos-forecasting>=2.0",
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
    # Dipakai test untuk membuat artifact ONNX; bukan dependensi runtime.
    "skl2onnx>=1.16",
]

[tool.setuptools.packages.find]
include = ["stocklab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
