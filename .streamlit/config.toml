[server]
headless = true
# Ikat ke localhost saja. Default Streamlit mendengarkan di 0.0.0.0, yang
# membuat lab ini terbuka bagi siapa pun di jaringan yang sama.
address = "localhost"
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
backgroundColor = "#0B0B0F"
secondaryBackgroundColor = "#15151C"
textColor = "#F5F5F7"
primaryColor = "#FF9F0A"
